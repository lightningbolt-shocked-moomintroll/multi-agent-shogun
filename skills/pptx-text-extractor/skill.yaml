name: pptx-text-extractor
version: "1.0.0"
author: multi-agent-shogun
created: "2026-02-04"

description: |
  PowerPoint（.pptx）ファイルからテキスト・ノート・テーブルを自動抽出するスキル。
  python-pptx ライブラリを活用し、RAG（ベクトル検索）システムにおいて
  PDF/Wordと同様にプレゼンテーション資料の索引化を実現する。
  SmartArt は未対応。

use_cases:
  - PowerPoint 資料をRAGのベクトル検索対象に追加
  - プレゼンテーション資料からの自動テキスト抽出
  - スライド内容の分析・検索
  - 企業内ドキュメント一元管理の一部
  - 複数形式（PDF/Word/PowerPoint）の統一的な処理

triggers:
  - "PowerPoint を RAG に追加したい"
  - "pptx ファイルからテキストを抽出"
  - "プレゼンテーション資料を検索可能に"
  - "スライドのテキストを取得"
  - "pptx 処理を自動化"
  - "複数の pptx ファイルを一括処理"

files:
  - prompt.md                       # 実行時プロンプト
  - scripts/extract_pptx.py         # テキスト抽出スクリプト（設計のみ）

inputs:
  - name: pptx_path
    type: "str or list[str]"
    description: "抽出対象 PPTX ファイルパス（glob 対応）"
    required: true
    example: "presentation.pptx" or ["*.pptx", "documents/slide*.pptx"]

  - name: extraction_mode
    type: "str"
    enum: ["basic", "full", "rag-compatible"]
    default: "rag-compatible"
    description: |
      basic: スライドテキスト + ノートのみ（高速）
      full: テキスト + ノート + テーブル + メタデータ（包括的）
      rag-compatible: RAG 検索向けに最適化（PDF/Word との形式統一）

  - name: include_tables
    type: "bool"
    default: true
    description: "テーブルを Markdown 形式で抽出するか"

  - name: include_notes
    type: "bool"
    default: true
    description: "発表者ノート（Speaker Notes）を抽出するか"

  - name: include_metadata
    type: "bool"
    default: false
    description: "スライドメタデータ（作成日、作成者等）を抽出するか"

  - name: output_format
    type: "str"
    enum: ["text", "json", "markdown"]
    default: "json"
    description: |
      text: プレーンテキスト形式（RAG ベクトル化向け）
      json: JSON 形式（構造化データ）
      markdown: Markdown 形式（可読性重視）

  - name: max_slides
    type: "int"
    default: null
    description: "処理する最大スライド数（null=無制限）"

outputs:
  - name: extracted_content
    type: "list[dict]"
    description: "抽出されたスライドコンテンツ"

  - name: extracted_text
    type: "str"
    description: "統合されたテキスト（RAG 入力向け）"

  - name: statistics
    type: "dict"
    description: "処理統計（スライド数、テキスト行数、テーブル数、エラー数等）"

  - name: error_report
    type: "list[dict]"
    description: "処理中に発生したエラー（ファイル読み込み失敗等）"

modes:
  - name: basic
    description: "スライドテキスト + 発表者ノートのみ抽出（最速）"
    use_case: "素早く内容を把握したい場合"

  - name: full
    description: "テキスト + ノート + テーブル + メタデータ完全抽出"
    use_case: "詳細な情報が必要な場合"

  - name: rag-compatible
    description: "RAG ベクトル化に最適な形式で出力（PDF/Word との統一形式）"
    use_case: "portal RAG システムへの統合"

supported_pptx_features:
  - name: slide_text
    description: "スライド内のテキストボックス、図形からのテキスト抽出"
    status: "fully_supported"

  - name: speaker_notes
    description: "発表者ノート（スライドに添付されたメモ）"
    status: "fully_supported"

  - name: tables
    description: "スライド内の表データ（Markdown 形式に変換）"
    status: "fully_supported"

  - name: text_formatting
    description: "フォント色、太字、イタリックなどのスタイル情報"
    status: "partially_supported"
    note: "抽出可能だが、RAG では通常不要"

  - name: images
    description: "スライド内の画像・図形"
    status: "not_supported"
    note: "テキストベースの抽出のみ対応"

  - name: smartart
    description: "SmartArt（組織図、プロセス図など特殊図形）"
    status: "not_supported"
    note: "python-pptx の制限。Aspose.Slides 等の有料ツール必要"

  - name: embedded_video
    description: "動画ファイルの埋め込み"
    status: "not_supported"

library:
  name: python-pptx
  version: ">=1.0.0"
  description: "PowerPoint ファイル操作用の標準 Python ライブラリ"
  install_command: "pip install python-pptx"
  official_docs: "https://python-pptx.readthedocs.io/"

dependencies:
  - python-pptx >= 1.0.0
  - markdown >= 3.4.0 (Markdown 形式出力用)

tags:
  - python
  - document-processing
  - rag
  - text-extraction
  - automation
  - powerpoint

related_skills:
  - regex-bulk-replace (処理後の一括置換)
  - security-audit (セキュリティ監査)

notes: |
  ### 設計思想

  1. **PDF/Word との統一形式**: portal RAG システムで既に実装されている
     PDF（pdfplumber）と Word（python-docx）の抽出形式と統一する。

  2. **モジュール化**: basic/full/rag-compatible の3モードで、
     用途に応じた柔軟な抽出を実現。

  3. **エラーハンドリング**: 不正な PPTX ファイルでも部分的に
     抽出可能な場合は処理継続、統計情報で報告。

  4. **SmartArt 非対応の明示**: ドキュメントで明確に伝え、
     必要な場合の代替手段（Aspose 等）を提示。

  ### 実装上の注意点

  - スライド内の複数テキストボックスの抽出順序が
    視覚的な配置と異なる可能性がある（座標ソート検討）
  - テーブルセルの結合対応が必要な場合あり
  - RAG 向けの出力は、PDF/Word の既存処理と統一形式に
