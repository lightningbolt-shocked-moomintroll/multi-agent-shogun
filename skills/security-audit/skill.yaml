name: security-audit
version: "1.0.0"
author: multi-agent-shogun
created: "2026-02-02"

description: |
  コードベースのセキュリティ監査を実施するスキル。
  権限過剰、情報漏洩リスク、コマンドインジェクション、機密ファイルアクセスなどの
  セキュリティリスクを体系的に評価し、レポートを生成する。

use_cases:
  - 新規プロジェクトのセキュリティレビュー
  - CI/CDパイプラインへの導入前チェック
  - 権限設定の妥当性評価
  - 情報漏洩リスクの洗い出し
  - コマンドインジェクション脆弱性の検出
  - 機密ファイル露出のチェック

triggers:
  - "セキュリティ監査"
  - "セキュリティチェック"
  - "脆弱性を調べて"
  - "権限が過剰でないか確認"
  - "情報漏洩リスク"
  - "security audit"
  - "security review"

files:
  - prompt.md                     # 実行時プロンプト
  - templates/report.md           # レポートテンプレート

inputs:
  - name: target_directory
    type: "str"
    default: "."
    description: "監査対象ディレクトリ"

  - name: scope
    type: "str"
    enum: ["full", "permissions", "secrets", "injection", "quick"]
    default: "full"
    description: "監査スコープ"

  - name: output_format
    type: "str"
    enum: ["markdown", "json", "summary"]
    default: "markdown"
    description: "レポート出力形式"

outputs:
  - name: report
    type: "str"
    description: "セキュリティ監査レポート"

  - name: risk_level
    type: "str"
    enum: ["critical", "high", "medium", "low", "safe"]
    description: "総合リスクレベル"

  - name: findings
    type: "list[dict]"
    description: "検出された問題のリスト"

  - name: recommendations
    type: "list[str]"
    description: "推奨対策のリスト"

check_categories:
  - name: permissions
    description: "権限過剰チェック（危険なフラグ、sudo使用、ワイルドカード権限）"
  - name: secrets
    description: "機密情報チェック（ハードコードされた認証情報、APIキー、トークン）"
  - name: injection
    description: "インジェクション脆弱性（コマンド、SQL、XSS）"
  - name: file_access
    description: "ファイルアクセス（機密ファイル、ディレクトリトラバーサル）"
  - name: network
    description: "ネットワーク（安全でない通信、CORS設定）"
  - name: dependencies
    description: "依存関係（既知の脆弱性、古いバージョン）"

risk_levels:
  critical: "即座に対処が必要。本番環境での使用不可"
  high: "早急な対処を推奨。リスク受容には十分な検討が必要"
  medium: "計画的な対処を推奨。状況に応じてリスク受容可能"
  low: "改善の余地あり。優先度は低い"
  safe: "重大なリスクなし"

tags:
  - security
  - audit
  - review
  - permissions
  - vulnerability
